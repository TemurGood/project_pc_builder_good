<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b1b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="220" fill="url(#glow)"/>

  <!-- Subtle Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Top Brand & Category Header -->
  <rect x="24" y="20" width="130" height="28" rx="8" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
  <text x="89" y="39" text-anchor="middle" fill="#ef4444" font-family="monospace" font-weight="900" font-size="13">KINGSTON</text>

  <rect x="446" y="20" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="511" y="39" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-weight="700" font-size="12">STORAGE</text>

  <!-- Hardware Illustration -->
  
      <!-- M.2 NVMe 2280 Stick -->
      <rect x="120" y="125" width="360" height="96" rx="10" fill="#090d16" stroke="#ef4444" stroke-width="3"/>
      <!-- M.2 Gold Connector Left -->
      <rect x="108" y="142" width="16" height="62" rx="3" fill="#eab308"/>
      <!-- Controller & NAND Flash Chips -->
      <rect x="145" y="140" width="62" height="66" rx="6" fill="url(#metalGrad)"/>
      <rect x="222" y="138" width="235" height="70" rx="6" fill="#111827" stroke="#a855f7" stroke-width="2"/>
      <text x="340" y="168" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="18">Kingston NVMe</text>
      <text x="340" y="192" text-anchor="middle" fill="#ef4444" font-family="monospace" font-weight="800" font-size="14">1TB PCIe 4.0 • 7000 MB/s</text>
    

  <!-- Bottom Product Title Banner -->
  <rect x="24" y="310" width="552" height="70" rx="14" fill="#090d16" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="340" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="19">KC3000 NVMe M.2 1TB</text>
  <text x="44" y="364" fill="#ef4444" font-family="monospace" font-weight="700" font-size="13">1TB PCIe 4.0  •  7000 MB/s</text>
</svg>