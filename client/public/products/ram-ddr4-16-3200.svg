<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0d0d"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="220" fill="url(#glow)"/>

  <!-- Subtle Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Top Brand & Category Header -->
  <rect x="24" y="20" width="130" height="28" rx="8" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="1.5"/>
  <text x="89" y="39" text-anchor="middle" fill="#ef4444" font-family="monospace" font-weight="900" font-size="13">G.SKILL</text>

  <rect x="446" y="20" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="511" y="39" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-weight="700" font-size="12">RAM</text>

  <!-- Hardware Illustration -->
  
      <!-- Dual RAM Kit Modules -->
      <g transform="translate(0, -18)">
        
        <rect x="140" y="114" width="320" height="58" rx="8" fill="#111827" stroke="#ef4444" stroke-width="2.5"/>
        <rect x="160" y="172" width="280" height="8" rx="2" fill="#eab308"/>
        <text x="300" y="149" text-anchor="middle" fill="#ffffff" font-family="monospace" font-weight="900" font-size="16">G.Skill 16GB (2x8GB)</text>
      </g>
      <g transform="translate(0, 62)">
        
        <rect x="140" y="114" width="320" height="58" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2.5"/>
        <rect x="160" y="172" width="280" height="8" rx="2" fill="#eab308"/>
        <text x="300" y="149" text-anchor="middle" fill="#ef4444" font-family="monospace" font-weight="900" font-size="15">DDR4 3200MHz CL16</text>
      </g>
    

  <!-- Bottom Product Title Banner -->
  <rect x="24" y="310" width="552" height="70" rx="14" fill="#090d16" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="340" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="19">Aegis DDR4 16GB (2x8GB)</text>
  <text x="44" y="364" fill="#ef4444" font-family="monospace" font-weight="700" font-size="13">16GB (2x8GB)  •  DDR4 3200MHz CL16</text>
</svg>