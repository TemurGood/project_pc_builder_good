<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091d26"/>
      <stop offset="100%" stop-color="#0c0a1d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="220" fill="url(#glow)"/>

  <!-- Subtle Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Top Brand & Category Header -->
  <rect x="24" y="20" width="130" height="28" rx="8" fill="#06b6d4" fill-opacity="0.18" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="89" y="39" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-weight="900" font-size="13">ASUS</text>

  <rect x="446" y="20" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="511" y="39" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-weight="700" font-size="12">MOTHERBOARD</text>

  <!-- Hardware Illustration -->
  
      <!-- Motherboard PCB -->
      <rect x="175" y="65" width="250" height="220" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5"/>
      <!-- VRM Heatsinks -->
      <rect x="190" y="80" width="38" height="95" rx="6" fill="url(#metalGrad)" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="235" y="75" width="90" height="28" rx="5" fill="url(#metalGrad)" stroke="#06b6d4" stroke-width="1.5"/>
      <!-- CPU Socket -->
      <rect x="250" y="115" width="62" height="62" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
      <rect x="262" y="127" width="38" height="38" rx="3" fill="#06b6d4" opacity="0.25"/>
      <!-- 4 DIMM Slots -->
      <line x1="335" y1="108" x2="335" y2="182" stroke="#06b6d4" stroke-width="4"/>
      <line x1="346" y1="108" x2="346" y2="182" stroke="#475569" stroke-width="4"/>
      <line x1="357" y1="108" x2="357" y2="182" stroke="#06b6d4" stroke-width="4"/>
      <line x1="368" y1="108" x2="368" y2="182" stroke="#475569" stroke-width="4"/>
      <!-- PCIe Steel Slot + M.2 Armor -->
      <rect x="195" y="198" width="145" height="12" rx="3" fill="#cbd5e1"/>
      <rect x="195" y="220" width="120" height="22" rx="4" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <!-- Chipset Heatsink -->
      <rect x="335" y="205" width="68" height="58" rx="8" fill="url(#metalGrad)" stroke="#06b6d4" stroke-width="2"/>
      <text x="369" y="239" text-anchor="middle" fill="#0f172a" font-family="monospace" font-weight="900" font-size="13">B760M</text>
    

  <!-- Bottom Product Title Banner -->
  <rect x="24" y="310" width="552" height="70" rx="14" fill="#090d16" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="340" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="19">PRIME B760M-K D4</text>
  <text x="44" y="364" fill="#06b6d4" font-family="monospace" font-weight="700" font-size="13">B760M  •  LGA1700 • DDR4</text>
</svg>