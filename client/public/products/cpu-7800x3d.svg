<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1008"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="220" fill="url(#glow)"/>

  <!-- Subtle Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Top Brand & Category Header -->
  <rect x="24" y="20" width="130" height="28" rx="8" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-width="1.5"/>
  <text x="89" y="39" text-anchor="middle" fill="#f97316" font-family="monospace" font-weight="900" font-size="13">AMD</text>

  <rect x="446" y="20" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="511" y="39" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-weight="700" font-size="12">CPU</text>

  <!-- Hardware Illustration -->
  
      <!-- CPU Substrate -->
      <rect x="200" y="75" width="200" height="200" rx="16" fill="#0d4a29" stroke="#f97316" stroke-width="3"/>
      <!-- Gold Contact Pins Grid -->
      <rect x="212" y="87" width="176" height="176" rx="10" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="6 4" opacity="0.65"/>
      <!-- Nickel Integrated Heat Spreader (IHS) -->
      <rect x="226" y="101" width="148" height="148" rx="22" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="3"/>
      
        <!-- AMD AM5 notched IHS cutouts -->
        <circle cx="226" cy="135" r="8" fill="#0d4a29"/>
        <circle cx="374" cy="135" r="8" fill="#0d4a29"/>
        <circle cx="226" cy="215" r="8" fill="#0d4a29"/>
        <circle cx="374" cy="215" r="8" fill="#0d4a29"/>
      
      <text x="300" y="158" text-anchor="middle" fill="#0f172a" font-family="monospace" font-weight="900" font-size="22">AMD</text>
      <text x="300" y="185" text-anchor="middle" fill="#f97316" font-family="sans-serif" font-weight="900" font-size="16">8C/16T • 5.0GHz</text>
      <text x="300" y="210" text-anchor="middle" fill="#334155" font-family="monospace" font-weight="700" font-size="12">3D V-CACHE AM5</text>
    

  <!-- Bottom Product Title Banner -->
  <rect x="24" y="310" width="552" height="70" rx="14" fill="#090d16" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="340" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="19">Ryzen 7 7800X3D</text>
  <text x="44" y="364" fill="#f97316" font-family="monospace" font-weight="700" font-size="13">8C/16T • 5.0GHz  •  3D V-CACHE AM5</text>
</svg>