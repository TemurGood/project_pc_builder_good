<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082032"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  <circle cx="300" cy="180" r="220" fill="url(#glow)"/>

  <!-- Subtle Tech Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="320" x2="600" y2="320"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Top Brand & Category Header -->
  <rect x="24" y="20" width="130" height="28" rx="8" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="89" y="39" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-weight="900" font-size="13">ARCTIC</text>

  <rect x="446" y="20" width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="511" y="39" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-weight="700" font-size="12">COOLER</text>

  <!-- Hardware Illustration -->
  
        <!-- 360mm AIO Radiator + 3 ARGB Fans -->
        <rect x="120" y="85" width="360" height="110" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
        <circle cx="185" cy="140" r="42" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
        <circle cx="300" cy="140" r="42" fill="#090d16" stroke="#a855f7" stroke-width="3"/>
        <circle cx="415" cy="140" r="42" fill="#090d16" stroke="#38bdf8" stroke-width="3"/>
        <!-- Pump Block -->
        <circle cx="300" cy="245" r="32" fill="#111827" stroke="url(#accentGrad)" stroke-width="4"/>
        <path d="M 270 235 Q 230 215 240 195" fill="none" stroke="#475569" stroke-width="6"/>
        <path d="M 330 235 Q 370 215 360 195" fill="none" stroke="#475569" stroke-width="6"/>
      

  <!-- Bottom Product Title Banner -->
  <rect x="24" y="310" width="552" height="70" rx="14" fill="#090d16" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5"/>
  <text x="44" y="340" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="19">Liquid Freezer III 360 A-RGB</text>
  <text x="44" y="364" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="13">350W TDP  •  AIO 360MM WATER</text>
</svg>